name: build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir build
          cd build
          cmake ..
          make

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site-generator
          path: build/ssg
